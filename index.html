  <style>
    :root {
      --cream:246 244 238; --surface:255 255 255; --ink:47 51 51; --muted:122 127 124; --fg:0 0 0;
      --s50:241 245 240; --s100:227 236 226; --s200:201 219 200; --s600:88 124 91; --s700:69 98 74;
      --l50:246 244 251; --l100:236 232 246; --l700:94 79 153;
      color-scheme: light;
    }
    html.dark {
      --cream:22 25 24; --surface:33 38 36; --ink:236 234 228; --muted:154 160 156; --fg:255 255 255;
      --s50:31 42 33; --s100:40 54 41; --s200:52 70 58; --s600:169 196 168; --s700:201 219 200;
      --l50:40 37 51; --l100:51 46 64; --l700:197 187 230;
      color-scheme: dark;
    }
    html { background:rgb(var(--cream)); }
    html.dark .shadow-soft { box-shadow: 0 0 0 1px rgba(255,255,255,.05), 0 4px 18px rgba(0,0,0,.35) !important; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", Inter, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      overscroll-behavior-y: none;
      -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none;
    }
    input, textarea, select { font-size:16px; -webkit-user-select:text; user-select:text; } /* 16px = niente zoom automatico su iOS */
    .safe-top { padding-top: max(env(safe-area-inset-top), 12px); }
    #view { padding-bottom: calc(env(safe-area-inset-bottom) + 104px); }
    #tabbar { padding-bottom: env(safe-area-inset-bottom); }
    #toast { bottom: calc(env(safe-area-inset-bottom) + 84px); }
    input[type=date], input[type=time] { -webkit-appearance:none; appearance:none; display:flex; align-items:center; min-height:48px; }
    input::-webkit-date-and-time-value { text-align:left; }
    .chip input { position:absolute; opacity:0; pointer-events:none; }
    .chip input:checked + span { background:var(--c) !important; color:#fff !important; border-color:var(--c) !important; }
    .tabular-nums { font-variant-numeric: tabular-nums; }
    .bar { transition: width .7s cubic-bezier(.2,.8,.2,1); }
    .fade-in { animation: fade .35s ease both; }
    @keyframes fade { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:none; } }
    body.sheet-open, body.breath-open { overflow:hidden; }
    .no-scrollbar::-webkit-scrollbar { display:none; }

    /* ---------- Respiro guidato (overlay a tutto schermo) ---------- */
    #breath {
      position:fixed; inset:0; z-index:70; background:rgb(var(--cream));
      display:flex; flex-direction:column; align-items:center; justify-content:space-between;
      padding: max(env(safe-area-inset-top), 16px) 20px calc(env(safe-area-inset-bottom) + 24px);
      opacity:0; transition:opacity .4s ease;
    }
    #breath.on { opacity:1; }
    .justify-end { justify-content:flex-end; }   /* non presente nel Tailwind pre-compilato */
    .br-stage { position:relative; width:min(72vw, 280px); aspect-ratio:1; display:flex; align-items:center; justify-content:center; }
    .br-halo { position:absolute; inset:0; border-radius:50%; background:rgb(var(--s100)); }   /* guida: la grandezza massima */
    .br-ball {
      position:absolute; inset:0; border-radius:50%;
      background:radial-gradient(circle at 35% 30%, #A9C4A8, #6F9772 72%);
      box-shadow:0 12px 40px rgba(111,151,114,.35);
      transform:scale(.5); will-change:transform, opacity;
    }
    html.dark .br-ball { box-shadow:0 12px 40px rgba(0,0,0,.45); }
    .br-num { position:relative; font-size:40px; font-weight:600; color:#fff; font-variant-numeric:tabular-nums; min-height:1em; }
    .br-dot { width:8px; height:8px; border-radius:50%; background:rgb(var(--fg)/.12); transition:background .4s ease; }
    .br-dot.on { background:#8AAE8A; }
    @media (prefers-reduced-motion: reduce) { #breath, .br-dot { transition:none; } }

<script>
/* =========================================================
   RESPIRO — app personale anti-ansia
   Dati salvati in localStorage, nessun server.
   ========================================================= */

const KEY = 'respiro.v1';

/* ---------- Costanti ---------- */
const TAGS = {
  lavoro:   { label:'Lavoro',            short:'Lavoro',   icon:'briefcase', color:'#E0A872', bg:'#FBF1E6', text:'#9A6430', def:'Turno al negozio' },
  studio:   { label:'Studio',            short:'Studio',   icon:'book-open', color:'#9A8CCB', bg:'#EFECF8', text:'#5E4F99', def:'Studio' },
  riposo:   { label:'Personale/Riposo',  short:'Riposo',   icon:'leaf',      color:'#7FA883', bg:'#E8F0E7', text:'#45624A', def:'Tempo per me' },
  famiglia: { label:'Famiglia',          short:'Famiglia', icon:'house',     color:'#7FA6C9', bg:'#E7EFF7', text:'#41678C', def:'Famiglia' }
};
const OUT_CATS = {
  cibo:      { label:'Cibo',      icon:'utensils',        color:'#E0A872' },
  trasporti: { label:'Trasporti', icon:'bus',             color:'#7FA6C9' },
  shopping:  { label:'Shopping',  icon:'shopping-bag',    color:'#C99AB8' },
  svago:     { label:'Svago',     icon:'sparkles',        color:'#9A8CCB' },
  altro:     { label:'Altro',     icon:'circle-ellipsis', color:'#A3A8A4' }
};
const IN_CATS = {
  stipendio: { label:'Stipendio', icon:'wallet', color:'#6F9772' },
  mance:     { label:'Mance',     icon:'coins',  color:'#8AAE8A' },
  regalo:    { label:'Regalo',    icon:'gift',   color:'#C99AB8' },
  extra:     { label:'Altro',     icon:'plus',   color:'#A3A8A4' }
};
const TABS = [
  { id:'oggi',        label:'Oggi',        icon:'sun',            title:'Respiro' },
  { id:'studio',      label:'Studio',      icon:'graduation-cap', title:'Studio' },
  { id:'agenda',      label:'Agenda',      icon:'calendar-days',  title:'Agenda' },
  { id:'portafoglio', label:'Portafoglio', icon:'wallet',         title:'Portafoglio' }
];
const PHRASES = [
  'Un passo alla volta.',
  'Non devi fare tutto oggi. Solo il prossimo passo.',
  'Stai facendo più di quanto pensi.',
  'Va bene andare piano. Conta andare.',
  'Anche riposare è parte del lavoro.',
  'Piccoli passi, grandi distanze.',
  'Sei abbastanza, anche nei giorni lenti.',
  'Respira. Una cosa alla volta.',
  'Oggi basta fare il possibile.',
  'Sii gentile con te stessa, oggi.'
];

/* ---------- Stato ---------- */
const defaults = () => ({
  version: 1,
  name: '',
  onboarded: false,
  startBalance: 0,
  hideBalance: false,
  lastBackup: null,
  priorities: {},          // { 'YYYY-MM-DD': [{id,text,done}] }
  events: [],              // [{id,title,date,start,end,tag,note}]
  exams: [],               // [{id,name,date,units,unit,goals:[{id,text,done}]}]
  tx: [],                  // [{id,type:'in'|'out',amount,cat,note,date,created}]
  theme: 'auto',            // 'auto' | 'light' | 'dark'
  hourlyPay: 0,             // paga oraria lorda in € (0 = non impostata)
  workEnd: '2026-12-26',    // ultimo giorno di lavoro al negozio ('' = nessun countdown)
  heavyDay: '',             // 'YYYY-MM-DD' del giorno in cui è attiva la "giornata pesante"
  heavyPick: '',            // id della priorità scelta per quella giornata
  energy: {},               // { 'YYYY-MM-DD': 'low'|'mid'|'ok' } — "Come stai oggi?"
  backupNudge: '',          // 'YYYY-MM-DD' dell'ultimo promemoria backup mostrato in Oggi
  focus: { work:25, brk:5, sessions:{} },
  timer: null              // {mode,running,endAt,remaining}
});

function load() {
  try {
    const raw = JSON.parse(localStorage.getItem(KEY));
    if (!raw) return defaults();
    const d = defaults();
    return { ...d, ...raw, focus: { ...d.focus, ...(raw.focus || {}) } };
  } catch (e) { return defaults(); }
}
let S = load();

function eventsOn(date, applyFilter = false) {
  const list = S.events.filter(e => e.date === date);
  S.exams.filter(x => x.date === date).forEach(x => list.push({ id:x.id, title:'Esame: ' + x.name, date, start:'', end:'', tag:'studio', virtual:true }));
  return list

    .sort((a, b) => (a.start || '').localeCompare(b.start || ''));
}
function balance() {
  return (+S.startBalance || 0) + sum(S.tx.filter(t => t.type === 'in')) - sum(S.tx.filter(t => t.type === 'out'));
}

/* ---------- Toast ---------- */
let toastTimer;
function toast(msg, ms = 2400) {
  const t = $('#toast');
  t.innerHTML = `<div class="px-5 py-3 rounded-full bg-ink/90 text-cream text-[15px] shadow-lg whitespace-nowrap">${esc(msg)}</div>`;
  t.classList.remove('opacity-0', 'translate-y-2');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('opacity-0', 'translate-y-2'), ms);
}

/* ---------- Bottom sheet ---------- */
let sheetToken = 0;
function sheetHead(title) {
  return `<div class="flex items-center justify-between mb-4">
    <h3 class="text-[22px] font-bold text-ink">${title}</h3>
    <button type="button" data-action="closeSheet" class="icon-btn bg-cream text-muted" aria-label="Chiudi"><i data-lucide="x" class="w-5 h-5"></i></button>
  </div>`;
}
function openSheet(html) {
  sheetToken++;
  const root = $('#sheet-root');
  root.innerHTML = `
  <div class="fixed inset-0 z-50">
    <div data-action="closeSheet" class="sheet-bg absolute inset-0 bg-[rgba(0,0,0,.4)] opacity-0 transition-opacity duration-300"></div>
    <div class="sheet-panel absolute inset-x-0 bottom-0 max-w-xl mx-auto bg-surface rounded-t-[28px] shadow-2xl max-h-[92vh] overflow-y-auto translate-y-full transition-transform duration-300 ease-out"
         style="padding-bottom:calc(env(safe-area-inset-bottom) + 20px)">
      <div class="sticky top-0 bg-surface/95 backdrop-blur pt-2.5 pb-2 flex justify-center z-10"><span class="w-10 h-1.5 rounded-full bg-black/10"></span></div>
      <div class="px-5">${html}</div>
    </div>
  </div>`;
  document.body.classList.add('sheet-open');
  icons();
  requestAnimationFrame(() => requestAnimationFrame(() => {
    root.querySelector('.sheet-bg')?.classList.remove('opacity-0');
    root.querySelector('.sheet-panel')?.classList.remove('translate-y-full');
  }));
}
function closeSheet() {
  const root = $('#sheet-root');
  const p = root.querySelector('.sheet-panel');
  if (!p) return;
  const t = ++sheetToken;
  p.classList.add('translate-y-full');
  root.querySelector('.sheet-bg').classList.add('opacity-0');
  document.body.classList.remove('sheet-open');
  setTimeout(() => { if (t === sheetToken) root.innerHTML = ''; }, 300);
}
let confirmCb = null;
function askConfirm({ title, text, ok = 'Conferma', cb }) {
  confirmCb = cb;
  openSheet(`${sheetHead(title)}
    <p class="text-muted mb-6 text-[16px] leading-relaxed">${text}</p>
    <div class="space-y-2">
      <button data-action="confirmOk" class="btn-primary !bg-ink !text-cream">${ok}</button>
      <button data-action="closeSheet" class="btn-soft w-full">Annulla</button>
    </div>`);
}

          <span class="w-14 h-8 rounded-full flex items-center justify-center transition ${x.id === tab ? 'bg-sage-100' : ''}"><i data-lucide="${x.icon}" class="w-[22px] h-[22px]"></i></span>
          <span class="text-[11px] font-medium">${x.label}</span>
        </button>`).join('')}

}

/* ---------- TAB 1: OGGI ---------- */
function vOggi() {
  const now = new Date(), h = now.getHours(), today = iso(now);
  const greet = h < 5 ? 'Buonanotte' : h < 12 ? 'Buongiorno' : h < 18 ? 'Buon pomeriggio' : 'Buonasera';
  const gIcon = (h < 5 || h >= 21) ? 'moon' : h < 12 ? 'sunrise' : h < 18 ? 'sun' : 'sunset';
  const pr = S.priorities[today] || [];
  const done = pr.filter(p => p.done).length;
  const ev = eventsOn(today);
  const yUndone = (S.priorities[iso(addDays(now, -1))] || []).filter(p => !p.done);

  let prMsg = '';
  if (pr.length && done === pr.length) prMsg = `<p class="mt-3 text-sage-600 font-medium">Ottimo lavoro oggi 🌿 Ora puoi rallentare.</p>`;
  else if (pr.length === 3) prMsg = `<p class="mt-3 text-sm text-muted">Tre bastano. Il resto può aspettare.</p>`;

  const next = S.exams.filter(x => x.date && daysUntil(x.date) >= 0).sort((a, b) => a.date.localeCompare(b.date))[0];
  const heavy = heavyOn();

  return `
  <section class="pt-1 pb-5">
    <div class="flex items-center gap-2 text-sage-600"><i data-lucide="${gIcon}" class="w-5 h-5"></i><span class="text-sm font-medium">${fmtLong(today)}</span></div>
    <h2 class="text-[28px] leading-tight font-bold text-ink mt-1.5">${greet}${S.name ? ', ' + esc(S.name) : ''}</h2>
    <p class="text-muted mt-1 text-[16px]">${heavy ? 'Oggi si va piano. Va benissimo così.' : phrase()}</p>
    <div class="mt-4 flex flex-wrap gap-2">
      <button data-action="quickAdd" class="h-12 px-6 rounded-full bg-sage-500 text-white font-semibold inline-flex items-center gap-2 shadow-soft active:scale-95 transition">
        <i data-lucide="plus" class="w-5 h-5"></i>Aggiungi
      </button>
      <button data-action="breath" class="h-12 px-5 rounded-full bg-surface text-sage-700 font-semibold inline-flex items-center gap-2 shadow-soft active:scale-95 transition">
        <i data-lucide="wind" class="w-5 h-5"></i>Respira 1 minuto
      </button>
    </div>
  </section>

  ${moodCard(heavy)}

  ${heavy ? heavyPrioCard(pr) : `
  <section class="card">
    <div class="flex items-center justify-between mb-2">
      <h3 class="h-card">Le 3 priorità di oggi</h3>
      <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-sage-100 text-sage-700">${done}/${pr.length || 3}</span>
    </div>
    ${!pr.length ? `<p class="text-sm text-muted mb-2">Scegli al massimo tre cose. Non di più: così la giornata resta leggera.</p>` : ''}
    ${pr.map(p => checkRow(p, 'togglePrio', 'delPrio')).join('')}
    ${pr.length < 3 ? `
      <form data-form="addPrio" class="flex gap-2 mt-2">
        <input name="text" class="inp flex-1" placeholder="${pr.length ? 'Un’altra cosa importante?' : 'Cosa conta davvero oggi?'}" maxlength="80" autocomplete="off" enterkeyhint="done">
        <button class="w-12 h-12 shrink-0 rounded-2xl bg-sage-100 text-sage-700 flex items-center justify-center active:scale-95 transition" aria-label="Aggiungi priorità"><i data-lucide="plus" class="w-5 h-5"></i></button>
      </form>` : ''}
    ${!pr.length && yUndone.length ? `
      <button data-action="carryPrio" class="mt-3 w-full btn-soft !bg-lav-50 !text-lav-700"><i data-lucide="corner-down-right" class="w-4 h-4"></i>Riprendi ${yUndone.length === 1 ? 'quella' : 'quelle'} di ieri (${Math.min(yUndone.length, 3)})</button>` : ''}
    ${prMsg}
  </section>`}

  <section class="card mt-4">
    <div class="flex items-center justify-between mb-1">
      <h3 class="h-card">La tua giornata</h3>
      <button data-action="tab" data-tab="agenda" class="h-11 px-2 -mr-2 text-sm font-medium text-sage-600 flex items-center gap-1">Agenda<i data-lucide="chevron-right" class="w-4 h-4"></i></button>
    </div>
    ${ev.length ? `<div class="divide-y divide-black/5">${ev.map(eventRow).join('')}</div>`
      : `<div class="py-5 text-center"><div class="text-3xl mb-1">🌿</div><p class="text-muted">Giornata libera. Goditi un po' di respiro.</p></div>`}
  </section>

  ${next && !heavy ? examMini(next) : ''}
  `;
}

/* ---------- Modalità "giornata pesante" ----------
   Vale solo per il giorno in cui la attiva (S.heavyDay = data ISO):
   il giorno dopo la data non coincide più e tutto torna normale da solo.
   Le altre priorità non vengono toccate, solo nascoste. */
const heavyOn = () => S.heavyDay === iso(new Date());

/* "Come stai oggi?" — energia del giorno con un tap (tocca di nuovo per togliere).
   Se è stanca (😴), propone con gentilezza la giornata leggera. */
const ENERGY = [['low', '😴', 'Stanca'], ['mid', '😐', 'Così così'], ['ok', '🙂', 'Bene']];
function moodCard(heavy) {
  const cur = S.energy[iso(new Date())] || '';
  let foot = '';
  if (heavy) foot = `
    <div class="mt-3 flex items-center justify-between gap-2">
      <span class="text-sm text-lav-700">Oggi solo l’essenziale, fino a stanotte 💛</span>
      <button data-action="toggleHeavy" class="h-11 px-3 -mr-2 text-sm font-medium text-muted shrink-0">Mostra tutto</button>
    </div>`;
  else if (cur === 'low') foot = `
    <div class="mt-3 flex items-center justify-between gap-2">
      <span class="text-sm text-muted">Giornata stanca. Vuoi alleggerirla?</span>
      <button data-action="toggleHeavy" class="h-11 px-4 rounded-full text-sm font-semibold bg-lav-100 text-lav-700 shrink-0 active:scale-95 transition">Una cosa sola</button>
    </div>`;
  return `
  <section class="card !p-4 mb-4 ${heavy ? '!bg-lav-50' : ''}">

    <div class="grid grid-cols-3 gap-2">${ENERGY.map(([k, e, l]) => `
      <button data-action="setEnergy" data-v="${k}" aria-pressed="${cur === k}" class="h-[68px] rounded-2xl flex flex-col items-center justify-center gap-0.5 transition active:scale-95 ${cur === k ? 'bg-lav-100' : 'bg-cream'}">
        <span class="text-[24px] leading-tight">${e}</span>
        <span class="text-xs ${cur === k ? 'text-lav-700 font-semibold' : 'text-muted'}">${l}</span>
      </button>`).join('')}
    </div>${foot}
  </section>`;
}
function heavyPrioCard(pr) {
  const pick = pr.find(p => p.id === S.heavyPick) || pr.find(p => !p.done) || pr[0];
  const others = pr.filter(p => p !== pick && !p.done);
  return `
  <section class="card !bg-lav-50">
    <h3 class="h-card">Oggi basta una cosa</h3>
    <p class="text-sm text-muted mt-1 mb-2">Solo questa. Tutto il resto può aspettare, e va bene così.</p>
    ${pick ? checkRow(pick, 'togglePrio', 'delPrio') : `
      <form data-form="addPrio" class="flex gap-2 mt-2">
        <input name="text" class="inp flex-1" placeholder="Qual è l’unica cosa che conta oggi?" maxlength="80" autocomplete="off" enterkeyhint="done">
        <button class="w-12 h-12 shrink-0 rounded-2xl bg-lav-100 text-lav-700 flex items-center justify-center active:scale-95 transition" aria-label="Aggiungi"><i data-lucide="plus" class="w-5 h-5"></i></button>
      </form>`}
    ${pick && pick.done ? `<p class="mt-3 text-lav-700 font-medium">Fatto. Per oggi è abbastanza 💛</p>` : ''}
    ${pick && !pick.done && others.length ? `<button data-action="heavyNext" class="mt-1 h-11 text-sm font-medium text-lav-700 flex items-center gap-1.5"><i data-lucide="repeat" class="w-4 h-4"></i>Scegline un’altra</button>` : ''}
    ${pr.length > 1 ? `<p class="text-xs text-muted mt-2">Le altre restano qui, al sicuro. Le ritrovi quando vuoi.</p>` : ''}

}

function checkRow(item, toggleAction, delAction, extra = '') {

    <button data-action="${delAction}" data-id="${item.id}" ${extra} class="w-11 h-11 -mr-2 flex items-center justify-center text-black/20 shrink-0" aria-label="Rimuovi"><i data-lucide="x" class="w-4 h-4"></i></button>

function eventRow(e) {

    <div class="flex-1 min-w-0">
      <div class="font-medium text-ink truncate">${esc(e.title)}</div>

}

function examStats(ex) {
  const total = ex.goals.length, done = ex.goals.filter(g => g.done).length;
  return { total, done, pct: total ? Math.round(done / total * 100) : 0, d: ex.date ? daysUntil(ex.date) : null };
}
function daysText(d) {
  if (d === null) return 'Senza data';
  if (d > 1) return `Mancano ${d} giorni`;
  if (d === 1) return 'Domani';
  if (d === 0) return 'Oggi — ce la fai 💛';
  return 'Concluso';
}
function examMini(ex) {

  return `
  <button data-action="goStudio" class="card mt-4 w-full text-left active:scale-[.99] transition">

}

/* ---------- TAB 2: STUDIO ---------- */
function vStudio() {

  <div class="flex items-center justify-between pt-1 pb-3">

    <button data-action="newExam" class="h-11 px-4 rounded-full bg-sage-500 text-white font-semibold flex items-center gap-1.5 shadow-soft active:scale-95 transition"><i data-lucide="plus" class="w-5 h-5"></i>Esame</button>
  </div>
  ${exams.length ? exams.map(examCard).join('') : `
    <section class="card text-center py-8">

      <h3 class="h-card">Nessun esame ancora</h3>

function examCard(ex) {
  const s = examStats(ex);
  const left = s.total - s.done;
  let pace = '';
  if (s.total && left === 0) pace = 'Tutto fatto. Sei pronta 💛';
  else if (s.d > 0 && left > 0) { const per = Math.ceil(left / s.d); pace = `Circa ${per} ${per === 1 ? 'obiettivo' : 'obiettivi'} al giorno ${per <= 2 ? '— si può fare 🌱' : ''}`; }
  const collapsed = collapsedExams.has(ex.id);
  return `
  <section class="card mb-4">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h3 class="text-[19px] font-bold text-ink leading-tight">${esc(ex.name)}</h3>
        <p class="text-sm text-muted mt-1">${ex.date ? fmtLong(ex.date) + ' · ' : ''}<span class="text-lav-700 font-medium">${daysText(s.d)}</span></p>
        ${ex.units ? `<p class="text-xs text-muted mt-0.5">${ex.units} ${ex.unit} in totale</p>` : ''}
      </div>
      <div class="flex shrink-0 -mr-2">
        <button data-action="editExam" data-id="${ex.id}" class="icon-btn text-muted" aria-label="Modifica"><i data-lucide="pencil" class="w-[18px] h-[18px]"></i></button>
        <button data-action="delExam" data-id="${ex.id}" class="icon-btn text-muted" aria-label="Elimina"><i data-lucide="trash-2" class="w-[18px] h-[18px]"></i></button>
      </div>
    </div>

    <div class="mt-4">
      <div class="flex justify-between text-sm mb-1.5"><span class="text-muted">${s.done} di ${s.total} micro-obiettivi</span><span class="font-semibold text-sage-600">${s.pct}%</span></div>
      <div class="h-3 rounded-full bg-sage-50 overflow-hidden"><div class="bar h-full rounded-full bg-gradient-to-r from-sage-300 to-sage-500" style="width:${s.pct}%"></div></div>
      ${pace ? `<p class="text-sm text-sage-700 mt-2">${pace}</p>` : ''}
    </div>

    ${s.total ? `
      <button data-action="toggleGoals" data-id="${ex.id}" class="mt-3 h-11 w-full flex items-center justify-between text-sm font-medium text-muted">

      </button>
      ${collapsed ? '' : `<div class="border-t border-black/5 pt-1">${ex.goals.map(g => checkRow(g, 'toggleGoal', 'delGoal', `data-ex="${ex.id}"`)).join('')}</div>`}

    ${collapsed ? '' : `

      <button class="w-12 h-12 shrink-0 rounded-2xl bg-sage-100 text-sage-700 flex items-center justify-center" aria-label="Aggiungi"><i data-lucide="plus" class="w-5 h-5"></i></button>
    </form>`}

    <button data-action="splitExam" data-id="${ex.id}" class="mt-3 w-full btn-soft !bg-lav-50 !text-lav-700"><i data-lucide="sparkles" class="w-4 h-4"></i>Dividi automaticamente</button>
  </section>`;
}

/* ---------- Timer Focus ---------- */
function timerDur(mode) { return (mode === 'work' ? S.focus.work : S.focus.brk) * 60; }
function T() {
  if (!S.timer) S.timer = { mode:'work', running:false, endAt:null, remaining:timerDur('work') };
  return S.timer;
}
function timerLeft() {
  const t = T();
  return t.running ? Math.max(0, Math.round((t.endAt - Date.now()) / 1000)) : t.remaining;
}
function timerCard() {
  const t = T(), left = timerLeft(), total = timerDur(t.mode) || 1, C = 2 * Math.PI * 52;
  const work = t.mode === 'work';
  const col = work ? '#6F9772' : '#9A8CCB';
  const sess = S.focus.sessions[iso(new Date())] || 0;
  const presets = [[25, 5], [50, 10], [15, 3]];
  return `
  <section id="timer-card" class="card mb-2">
    <div class="flex items-center justify-between">
      <h3 class="h-card flex items-center gap-2"><i data-lucide="timer" class="w-5 h-5 text-sage-500"></i>Timer Focus</h3>
      <span class="text-xs font-medium px-2.5 py-1 rounded-full" style="${work ? soft('#8AAE8A', '#E3ECE2', '#45624A') : soft('#9A8CCB', '#ECE8F6', '#5E4F99')}">${work ? 'Studio' : 'Pausa'}</span>
    </div>
    <div class="flex flex-col items-center pt-4 pb-2">
      <div class="relative w-52 h-52">
        <svg viewBox="0 0 120 120" class="w-full h-full -rotate-90">
          <circle cx="60" cy="60" r="52" fill="none" stroke="currentColor" class="${work ? 'text-sage-50' : 'text-lav-50'}" stroke-width="8"/>
          <circle id="tm-ring" cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="8" stroke-linecap="round"
                  stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - left / total)).toFixed(2)}" style="transition:stroke-dashoffset 1s linear"/>
        </svg>
        <div class="absolute inset-0 flex flex-col items-center justify-center">
          <span id="tm-text" class="text-[44px] font-semibold text-ink tabular-nums tracking-tight">${mmss(left)}</span>
          <span class="text-xs text-muted">${work ? 'concentrati con calma' : 'stacca davvero'}</span>
        </div>
      </div>
      <div class="flex items-center gap-6 mt-4">
        <button data-action="timerReset" class="icon-btn bg-cream text-muted w-12 h-12" aria-label="Ricomincia"><i data-lucide="rotate-ccw" class="w-5 h-5"></i></button>
        <button data-action="timerToggle" class="w-[68px] h-[68px] rounded-full text-white flex items-center justify-center shadow-soft active:scale-95 transition" style="background:${col}" aria-label="${t.running ? 'Pausa' : 'Avvia'}">
          <i data-lucide="${t.running ? 'pause' : 'play'}" class="w-7 h-7 ${t.running ? '' : 'ml-1'}"></i>
        </button>
        <button data-action="timerSkip" class="icon-btn bg-cream text-muted w-12 h-12" aria-label="Salta"><i data-lucide="skip-forward" class="w-5 h-5"></i></button>
      </div>
    </div>
    <div class="flex justify-center gap-2 mt-3">
      ${presets.map(([w, b]) => {
        const on = S.focus.work === w && S.focus.brk === b;
        return `<button data-action="preset" data-w="${w}" data-b="${b}" class="h-10 px-4 rounded-full text-sm font-medium transition ${on ? 'bg-sage-500 text-white' : 'bg-cream text-muted'}">${w}/${b}</button>`;
      }).join('')}
    </div>
    <p class="text-center text-sm text-muted mt-3">${sess ? `Sessioni oggi: ${'🍃'.repeat(Math.min(sess, 8))}${sess > 8 ? ' +' + (sess - 8) : ''}` : 'Anche una sola sessione conta.'}</p>
  </section>`;
}
function updateTimerUI(full) {
  if (tab !== 'studio') return;
  if (full) {
    const el = $('#timer-card');
    if (el) { el.outerHTML = timerCard(); icons(); }
    return;
  }
  const t = T(), left = timerLeft(), total = timerDur(t.mode) || 1, C = 2 * Math.PI * 52;
  const txt = $('#tm-text'), ring = $('#tm-ring');
  if (txt) txt.textContent = mmss(left);
  if (ring) ring.setAttribute('stroke-dashoffset', (C * (1 - left / total)).toFixed(2));
}
function finishPhase(natural) {
  const t = T();
  if (t.mode === 'work' && natural) {
    const d = iso(new Date());
    S.focus.sessions[d] = (S.focus.sessions[d] || 0) + 1;
  }
  t.mode = t.mode === 'work' ? 'break' : 'work';
  t.running = false; t.endAt = null; t.remaining = timerDur(t.mode);
  save();
  if (natural) {
    chime();
    toast(t.mode === 'break' ? 'Sessione completata. Pausa meritata ☕' : 'Pausa finita. Riprendi con calma 🌱');
  }
  updateTimerUI(true);
}
setInterval(() => {
  const t = S.timer;
  if (t && t.running) { if (timerLeft() <= 0) finishPhase(true); else updateTimerUI(false); }
}, 1000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    const t = S.timer;
    if (t && t.running && timerLeft() <= 0) finishPhase(true);
    if (tab === 'oggi') { render(); setTimeout(maybeBackupNudge, 1200); } // aggiorna saluto/data se l'app resta aperta a lungo
  }
});

/* Suono gentile (WebAudio, sbloccato al primo tap su Play) */
let audioCtx = null;
function unlockAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch (e) {}
}
function chime() {
  if (!audioCtx) return;
  try {
    [523.25, 659.25, 783.99].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t0 = audioCtx.currentTime + i * 0.22;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(0.18, t0 + 0.04);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + 1.2);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + 1.3);
    });
  } catch (e) {}
}

/* ---------- Turni → ore e stipendio stimato ---------- */
const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + m; };
/* Durata di un turno in minuti. Se la fine è prima dell'inizio, il turno passa la mezzanotte
   (es. 18:00–02:00 = 8 h) e conta tutto nel giorno in cui inizia. Senza orari = 0. */
function shiftMinutes(e) {
  if (!e.start || !e.end) return 0;
  let d = toMin(e.end) - toMin(e.start);
  if (d < 0) d += 1440;
  return d;
}
/* Minuti di lavoro tra due date ISO (incluse) + quanti turni non hanno orari */
function workMinutes(from, to) {
  let min = 0, noTime = 0;
  S.events.forEach(e => {
    if (e.tag !== 'lavoro' || e.date < from || e.date > to) return;
    const m = shiftMinutes(e);
    if (m) min += m; else noTime++;
  });
  return { min, noTime };
}
const fmtH = m => { const h = Math.floor(m / 60), r = m % 60; return r ? `${h} h ${pad(r)}` : `${h} h`; };
const dayMonth = s => fromIso(s).toLocaleDateString('it-IT', { day:'numeric', month:'long' });

/* Turni che restano da oggi all'ultimo giorno di lavoro (quelli di oggi già finiti non contano) */
function shiftsLeft() {
  const today = iso(new Date());
  if (!S.workEnd || today > S.workEnd) return null;
  const now = new Date(), nowMin = now.getHours() * 60 + now.getMinutes();
  const n = S.events.filter(e => e.tag === 'lavoro' && e.date >= today && e.date <= S.workEnd &&
    !(e.date === today && e.start && e.end && e.end > e.start && toMin(e.end) <= nowMin)).length;
  return { n, days: daysUntil(S.workEnd) };
}

/* Card "Turni" — usata in Agenda (settimana/mese selezionati) e in Portafoglio (mese visualizzato) */
function workCard({ weekOf, ym }) {
  if (!S.events.some(e => e.tag === 'lavoro')) return '';
  const t = TAGS.lavoro, pay = +S.hourlyPay || 0;
  const money = min => !pay ? '' : S.hideBalance ? '≈ € • • •' : '≈ ' + eur0(min / 60 * pay);
  const tile = (label, w) => `
    <div class="rounded-2xl bg-cream p-3">
      <div class="text-xs text-muted">${label}</div>
      <div class="text-[22px] font-bold text-ink tabular-nums leading-tight mt-1">${fmtH(w.min)}</div>
      ${pay ? `<div class="text-sm text-sage-600 font-medium tabular-nums mt-0.5">${money(w.min)}</div>` : ''}
      ${w.noTime ? `<div class="text-xs text-muted mt-1">+ ${w.noTime} ${w.noTime === 1 ? 'turno' : 'turni'} senza orari</div>` : ''}
    </div>`;

  const tiles = [];
  if (weekOf) {
    const ws = startOfWeek(weekOf), we = addDays(ws, 6), today = iso(new Date());
    const isNow = today >= iso(ws) && today <= iso(we);
    tiles.push(tile(isNow ? 'Questa settimana' : `Settimana dal ${ws.getDate()} ${ws.toLocaleDateString('it-IT', { month:'short' })}`, workMinutes(iso(ws), iso(we))));
  }
  tiles.push(tile(monthLabel(ym), workMinutes(ym + '-01', ym + '-31')));

  const left = shiftsLeft();
  let cd = '';
  if (left) {
    const end = dayMonth(S.workEnd);
    const [big, small] =
      left.n > 1   ? [`Ultimi ${left.n} turni 🌿`, `fino al ${end}`] :
      left.n === 1 ? ['Ultimo turno 🌿', 'ce l’hai quasi fatta'] :
      left.days > 0 ? [`Ancora ${left.days} ${left.days === 1 ? 'giorno' : 'giorni'} 🌿`, `fino al ${end}`] :
                     ['Ultimo giorno 🌿', 'da domani si respira'];
    cd = `<div class="mt-3 rounded-2xl px-3 py-2 flex items-center gap-2 flex-wrap" style="${soft(t.color, t.bg, t.text)}">
      <span class="font-semibold">${big}</span><span class="text-sm">${small}</span></div>`;
  }

  return `
  <section class="card mt-4">
    <div class="flex items-center gap-3 mb-3">
      <span class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="${soft(t.color, t.bg, t.text)}"><i data-lucide="briefcase" class="w-[18px] h-[18px]"></i></span>
      <h3 class="h-card">Turni al negozio</h3>
    </div>
    <div class="grid ${tiles.length > 1 ? 'grid-cols-2' : ''} gap-3">${tiles.join('')}</div>
    ${pay ? `<p class="text-xs text-muted mt-2 ml-1">Stima lorda, prima di tasse e trattenute.</p>`
          : `<button data-action="settings" class="mt-2 h-11 text-sm font-medium text-sage-600 flex items-center gap-1">Imposta la paga oraria per la stima<i data-lucide="chevron-right" class="w-4 h-4"></i></button>`}
    ${cd}
  </section>`;
}

/* Versione compatta per il Portafoglio: una riga con ore e stima del mese, tocca per l'Agenda */
function workLine(ym) {
  const w = workMinutes(ym + '-01', ym + '-31');
  if (!w.min && !w.noTime) return '';
  const t = TAGS.lavoro, pay = +S.hourlyPay || 0;
  const money = pay && w.min ? ' · ' + (S.hideBalance ? '≈ € • • •' : '≈ ' + eur0(w.min / 60 * pay)) : '';
  const month = fromIso(ym + '-01').toLocaleDateString('it-IT', { month:'long' });
  return `
  <button data-action="tab" data-tab="agenda" class="card !p-4 mt-4 w-full flex items-center gap-3 text-left active:scale-[.99] transition">
    <span class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="${soft(t.color, t.bg, t.text)}"><i data-lucide="briefcase" class="w-[18px] h-[18px]"></i></span>
    <span class="flex-1 min-w-0 text-ink truncate">Turni di ${month}</span>
    <span class="font-semibold text-ink tabular-nums whitespace-nowrap">${fmtH(w.min)}${money}</span>
    <i data-lucide="chevron-right" class="w-4 h-4 text-black/20 shrink-0"></i>
  </button>`;
}

/* ---------- TAB 3: AGENDA ---------- */
function vAgenda() {
  const today = iso(new Date());
  const sel = fromIso(agSel);
  let grid = '';

  if (agMode === 'week') {
    const ws = startOfWeek(agSel);
    grid = `<div class="grid grid-cols-7 gap-1">${[...Array(7)].map((_, i) => dayCell(addDays(ws, i), true, true, today)).join('')}</div>`;
  } else {
    const first = new Date(sel.getFullYear(), sel.getMonth(), 1);
    const dim = new Date(sel.getFullYear(), sel.getMonth() + 1, 0).getDate();
    const start = startOfWeek(iso(first));
    const offset = (first.getDay() + 6) % 7;
    const cells = Math.ceil((offset + dim) / 7) * 7;
    grid = `
      <div class="grid grid-cols-7 gap-1 mb-1">${['L', 'M', 'M', 'G', 'V', 'S', 'D'].map(d => `<div class="text-center text-[11px] font-semibold text-muted">${d}</div>`).join('')}</div>
      <div class="grid grid-cols-7 gap-1">${[...Array(cells)].map((_, i) => { const d = addDays(start, i); return dayCell(d, d.getMonth() === sel.getMonth(), false, today); }).join('')}</div>`;
  }

  const list = eventsOn(agSel, true);
  const label = agMode === 'week'
    ? (() => { const ws = startOfWeek(agSel), we = addDays(ws, 6); return `${ws.getDate()} ${ws.toLocaleDateString('it-IT', { month:'short' })} – ${we.getDate()} ${we.toLocaleDateString('it-IT', { month:'short' })}`; })()
    : monthLabel(agSel.slice(0, 7));

  return `
  <section class="card !p-4">
    <div class="flex items-center justify-between mb-3">
      <div class="flex bg-cream rounded-full p-1">
        ${['week', 'month'].map(m => `<button data-action="agMode" data-mode="${m}" class="h-9 px-4 rounded-full text-sm font-medium transition ${agMode === m ? 'bg-surface shadow-soft text-ink' : 'text-muted'}">${m === 'week' ? 'Settimana' : 'Mese'}</button>`).join('')}
      </div>
      <button data-action="agToday" class="h-9 px-3 rounded-full text-sm font-medium text-sage-600 bg-sage-50">Oggi</button>
    </div>
    <div class="flex items-center justify-between mb-2">
      <button data-action="agPrev" class="icon-btn text-muted" aria-label="Precedente"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
      <span class="font-semibold text-ink capitalize">${label}</span>
      <button data-action="agNext" class="icon-btn text-muted" aria-label="Successivo"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
    </div>
    ${grid}
  </section>

  <div class="flex gap-2 overflow-x-auto no-scrollbar py-4 -mx-4 px-4">
    ${Object.entries(TAGS).map(([k, t]) => `
      <button data-action="filterTag" data-tag="${k}" class="h-10 px-3.5 shrink-0 rounded-full text-sm font-medium flex items-center gap-1.5 transition ${agHidden.has(k) ? 'opacity-40' : ''}" style="${soft(t.color, t.bg, t.text)}">
        <span class="w-2.5 h-2.5 rounded-full" style="background:${t.color}"></span>${t.label}
      </button>`).join('')}
  </div>

  <section class="card">
    <div class="flex items-center justify-between mb-1">
      <h3 class="h-card">${agSel === today ? 'Oggi · ' : ''}${fmtLong(agSel)}</h3>
      <button data-action="newEvent" class="icon-btn bg-sage-500 text-white -mr-1" aria-label="Aggiungi impegno"><i data-lucide="plus" class="w-5 h-5"></i></button>
    </div>
    ${list.length ? `<div class="divide-y divide-black/5">${list.map(eventRow).join('')}</div>`
      : `<div class="py-6 text-center"><div class="text-3xl mb-1">☁️</div><p class="text-muted">Niente in programma.<br>Spazio per respirare.</p></div>`}
  </section>

  ${agHidden.has('lavoro') ? '' : workCard({ weekOf: agSel, ym: agSel.slice(0, 7) })}`;
}

function dayCell(d, inMonth, showDow, today) {
  const s = iso(d), sel = s === agSel, isT = s === today;
  const tags = [...new Set(eventsOn(s, true).map(e => e.tag))];
  return `
  <button data-action="selDay" data-date="${s}" class="flex flex-col items-center gap-1 py-1 min-h-[52px] rounded-2xl ${inMonth ? '' : 'opacity-35'}">
    ${showDow ? `<span class="text-[11px] font-semibold ${sel ? 'text-sage-600' : 'text-muted'}">${cap(d.toLocaleDateString('it-IT', { weekday:'short' }).slice(0, 3))}</span>` : ''}
    <span class="w-9 h-9 rounded-full flex items-center justify-center text-[15px] font-medium transition ${sel ? 'bg-sage-500 text-white' : isT ? 'ring-2 ring-sage-300 text-sage-700' : 'text-ink'}">${d.getDate()}</span>
    <span class="flex gap-0.5 h-1.5">${tags.slice(0, 4).map(t => `<span class="w-1.5 h-1.5 rounded-full" style="background:${TAGS[t].color}"></span>`).join('')}</span>
  </button>`;
}

/* ---------- TAB 4: PORTAFOGLIO ---------- */
function vWallet() {
  const bal = balance();
  const list = S.tx.filter(t => t.date.slice(0, 7) === wMonth).sort((a, b) => b.date.localeCompare(a.date) || (b.created || 0) - (a.created || 0));
  const inc = sum(list.filter(t => t.type === 'in'));
  const out = sum(list.filter(t => t.type === 'out'));
  const diff = inc - out;
  const byCat = Object.keys(OUT_CATS).map(k => ({ k, v: sum(list.filter(t => t.type === 'out' && t.cat === k)) })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
  const groups = {};
  list.forEach(t => (groups[t.date] = groups[t.date] || []).push(t));
  const today = iso(new Date()), yest = iso(addDays(new Date(), -1));

  return `
  <section class="rounded-3xl p-5 text-white shadow-soft bg-gradient-to-br from-[#8AAE8A] to-[#587C5B]">
    <div class="flex items-center justify-between">
      <span class="text-sm text-white/80 font-medium">Saldo attuale</span>
      <button data-action="toggleBal" class="icon-btn -mr-2 text-white/90" aria-label="Mostra o nascondi saldo"><i data-lucide="${S.hideBalance ? 'eye-off' : 'eye'}" class="w-5 h-5"></i></button>
    </div>
    <button data-action="toggleBal" class="block text-left text-[40px] font-bold tracking-tight tabular-nums leading-tight mt-1">${S.hideBalance ? '€ • • • •' : eur(bal)}</button>
    <p class="text-sm text-white/75 mt-1">${S.hideBalance ? 'Tocca per mostrare' : 'Tocca per nascondere'}</p>
  </section>

  <div class="grid grid-cols-2 gap-3 mt-4">
    <button data-action="newTx" data-type="in" class="h-14 rounded-2xl bg-surface shadow-soft font-semibold text-sage-700 flex items-center justify-center gap-2 active:scale-[.98] transition"><i data-lucide="arrow-down-left" class="w-5 h-5"></i>Entrata</button>
    <button data-action="newTx" data-type="out" class="h-14 rounded-2xl bg-surface shadow-soft font-semibold text-lav-700 flex items-center justify-center gap-2 active:scale-[.98] transition"><i data-lucide="arrow-up-right" class="w-5 h-5"></i>Uscita</button>
  </div>

  <div class="flex items-center justify-between mt-5 mb-2">
    <button data-action="wPrev" class="icon-btn text-muted" aria-label="Mese precedente"><i data-lucide="chevron-left" class="w-5 h-5"></i></button>
    <span class="font-semibold text-ink">${monthLabel(wMonth)}</span>
    <button data-action="wNext" class="icon-btn text-muted" aria-label="Mese successivo"><i data-lucide="chevron-right" class="w-5 h-5"></i></button>
  </div>

  <section class="card">
    <div class="grid grid-cols-3 gap-2 text-center">
      <div><div class="text-xs text-muted mb-1">Entrate</div><div class="font-semibold text-sage-600 tabular-nums">${eur(inc)}</div></div>
      <div><div class="text-xs text-muted mb-1">Uscite</div><div class="font-semibold text-ink tabular-nums">${eur(out)}</div></div>
      <div><div class="text-xs text-muted mb-1">Differenza</div><div class="font-semibold tabular-nums ${diff >= 0 ? 'text-sage-600' : 'text-lav-700'}">${diff >= 0 ? '+' : ''}${eur(diff)}</div></div>
    </div>
    ${list.length && diff < 0 ? `<p class="text-sm text-muted text-center mt-3">Questo mese sono uscite un po' più cose del previsto. Capita: ora lo sai, ed è già controllo. 🌿</p>` : ''}
    ${byCat.length ? `
      <div class="mt-5 space-y-3.5">
        ${byCat.map(({ k, v }) => { const c = OUT_CATS[k]; const p = out ? Math.round(v / out * 100) : 0; return `
          <div>
            <div class="flex items-center justify-between text-sm mb-1.5">
              <span class="flex items-center gap-2 text-ink"><i data-lucide="${c.icon}" class="w-4 h-4" style="color:${c.color}"></i>${c.label}</span>
              <span class="text-muted tabular-nums">${eur(v)} · ${p}%</span>
            </div>
            <div class="h-2 rounded-full bg-cream overflow-hidden"><div class="bar h-full rounded-full" style="width:${p}%;background:${c.color}"></div></div>
          </div>`; }).join('')}
      </div>` : ''}
  </section>

  ${workLine(wMonth)}

  <section class="mt-4">
    ${list.length ? Object.entries(groups).map(([d, items]) => `
      <h4 class="text-xs font-semibold uppercase tracking-wide text-muted px-2 mt-4 mb-2">${d === today ? 'Oggi' : d === yest ? 'Ieri' : cap(fmtShort(d))}</h4>
      <div class="card !p-2">${items.map(txRow).join('')}</div>`).join('')
    : `<div class="card text-center py-8"><div class="text-3xl mb-1">🪴</div><p class="text-muted">Nessun movimento questo mese.</p></div>`}
  </section>`;
}

function txRow(t) {
  const c = (t.type === 'in' ? IN_CATS : OUT_CATS)[t.cat] || OUT_CATS.altro;
  return `
  <button data-action="editTx" data-id="${t.id}" class="w-full flex items-center gap-3 p-2.5 rounded-2xl text-left active:bg-cream transition">
    <span class="w-11 h-11 rounded-2xl flex items-center justify-center shrink-0" style="background:${c.color}22;color:${c.color}"><i data-lucide="${c.icon}" class="w-5 h-5"></i></span>
    <div class="flex-1 min-w-0">
      <div class="font-medium text-ink truncate">${esc(t.note || c.label)}</div>
      <div class="text-xs text-muted">${c.label}</div>
    </div>
    <span class="font-semibold tabular-nums ${t.type === 'in' ? 'text-sage-600' : 'text-ink'}">${t.type === 'in' ? '+' : '−'}${eur(t.amount)}</span>
  </button>`;
}

/* =========================================================
   FORM (bottom sheet)
   ========================================================= */
function chip(name, value, label, icon, color, text, checked) {
  return `<label class="chip relative">
    <input type="radio" name="${name}" value="${value}" ${checked ? 'checked' : ''}>
    <span class="inline-flex items-center gap-1.5 h-11 px-4 rounded-full border-2 text-[15px] font-medium transition cursor-pointer" style="--c:${color};border-color:${color}40;color:${isDark() ? color : text}">
      <i data-lucide="${icon}" class="w-4 h-4"></i>${label}
    </span>
  </label>`;
}

function findItem(kind, id, exId) {
  if (kind === 'prio') return (S.priorities[iso(new Date())] || []).find(x => x.id === id);
  const ex = S.exams.find(x => x.id === exId);
  return ex ? ex.goals.find(g => g.id === id) : null;
}
function openItemForm(kind, id, exId) {
  const it = findItem(kind, id, exId);
  if (!it) return;
  const exAttr = kind === 'goal' ? `data-ex="${exId}"` : '';
  openSheet(`${sheetHead(kind === 'prio' ? 'Modifica priorità' : 'Modifica obiettivo')}
  <form data-form="editItem" data-kind="${kind}" data-id="${id}" ${exAttr} class="space-y-4">
    <input name="text" class="inp" value="${esc(it.text)}" maxlength="80" autocomplete="off" enterkeyhint="done" required>
    <label class="flex items-center gap-3 min-h-[44px]"><input type="checkbox" name="done" ${it.done ? 'checked' : ''} class="w-5 h-5" style="accent-color:#6F9772"><span>Fatto</span></label>
    <button class="btn-primary">Salva</button>
    <button type="button" data-action="${kind === 'prio' ? 'delPrio' : 'delGoal'}" data-id="${id}" ${exAttr} class="h-12 w-full rounded-2xl text-muted font-medium">Elimina</button>
  </form>`);
}

function openQuickAdd() {
  const opt = (action, icon, title, sub, bg, fg) => `
    <button data-action="${action}" class="w-full flex items-center gap-4 p-3 rounded-2xl active:bg-cream transition text-left">
      <span class="w-12 h-12 rounded-2xl flex items-center justify-center" style="${soft(fg === '#5E4F99' ? '#9A8CCB' : '#8AAE8A', bg, fg)}"><i data-lucide="${icon}" class="w-6 h-6"></i></span>
      <span><span class="block font-semibold text-ink">${title}</span><span class="block text-sm text-muted">${sub}</span></span>

function openSplit(id) {
  const ex = S.exams.find(x => x.id === id);
  if (!ex) return;

/* =========================================================
   BACKUP
   ========================================================= */
async function exportBackup() {
  // la data del backup si salva solo se l'esportazione va a buon fine (non se chiude la Share Sheet)
  const now = new Date().toISOString();
  const data = JSON.stringify({ app:'respiro', exportedAt:now, data:{ ...S, lastBackup:now } }, null, 2);
  const name = `respiro-backup-${iso(new Date())}.json`;
  const done = msg => {
    S.lastBackup = now; save();
    $('#bk-hint')?.remove();
    const l = $('#bk-last'); if (l) l.textContent = 'Ultimo backup: ' + fmtLong(now.slice(0, 10));
    toast(msg);
  };
  try {
    const file = new File([data], name, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file], title:'Backup Respiro' });
      done('Backup pronto ✓');
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([data], { type:'application/json' }));
  const a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  done('Backup scaricato ✓');
}

/* ---------- Promemoria backup ----------
   Se l'ultimo backup ha più di 7 giorni (o non c'è mai stato, ma ci sono dati):
   - in Impostazioni, una nota lavanda nella sezione Backup;
   - in Oggi, un toast gentile al massimo una volta a settimana (sparisce da solo). */
function backupAge() { return S.lastBackup ? Math.floor((Date.now() - Date.parse(S.lastBackup)) / 86400000) : null; }
const hasData = () => !!(S.events.length || S.tx.length || S.exams.length || Object.keys(S.priorities).length);
function backupDue() { const a = backupAge(); return a === null ? hasData() : a > 7; }
function maybeBackupNudge() {
  if (!S.onboarded || tab !== 'oggi' || br || $('#sheet-root').innerHTML || !backupDue()) return;
  if (S.backupNudge && daysUntil(S.backupNudge) > -7) return;   // già ricordato negli ultimi 7 giorni
  S.backupNudge = iso(new Date()); save();
  toast('Quando hai un minuto, fai un backup 🌿', 4500);
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const parsed = JSON.parse(r.result);
      const obj = parsed && parsed.data ? parsed.data : parsed;
      if (!obj || typeof obj !== 'object' || !('events' in obj || 'tx' in obj || 'exams' in obj)) throw new Error('formato');
      askConfirm({
        title:'Importare il backup?',
        text:'I dati attuali verranno sostituiti con quelli del backup.',
        ok:'Sì, importa',
        cb:() => {
          const d = defaults();
          S = { ...d, ...obj, onboarded:true, focus:{ ...d.focus, ...(obj.focus || {}) } };
          save(); applyTheme(); render(); toast('Backup importato ✓');
        }
      });
    } catch (e) { toast('File non valido'); }
  };
  r.readAsText(file);
}

/* =========================================================
   RESPIRO GUIDATO — 1 minuto: 4s inspira, 6s espira, 6 cicli
   Tutto è calcolato dal tempo trascorso (come il Timer Focus),
   così testo, numero e cerchio restano sempre sincronizzati.
   ========================================================= */
const BR = { lead:3000, inh:4000, exh:6000, cycles:6, min:.5 };   // min = grandezza del cerchio a polmoni vuoti
const reduceMQ = matchMedia('(prefers-reduced-motion: reduce)');
const brEase = x => (1 - Math.cos(Math.PI * x)) / 2;              // morbida all'inizio e alla fine
let br = null;   // sessione in corso: { start, pausedAt, raf, lock, done, last }

function openBreath() {
  unlockAudio();   // il tap sblocca l'audio per il suono gentile finale
  $('#breath-root').innerHTML = `
  <div id="breath" role="dialog" aria-modal="true" aria-label="Respiro guidato">
    <div class="w-full max-w-xl flex justify-end">
      <button data-action="breathClose" class="icon-btn bg-surface shadow-soft text-muted" aria-label="Chiudi"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <div class="flex flex-col items-center text-center">
      <div class="br-stage">
        <span class="br-halo"></span>
        <span id="br-ball" class="br-ball"></span>
        <span id="br-num" class="br-num"></span>
      </div>
      <p id="br-phase" class="text-[28px] font-semibold text-ink mt-7" role="status" aria-live="polite"></p>
      <p id="br-sub" class="text-muted mt-1 text-[16px]"></p>
      <div id="br-dots" class="flex gap-2 mt-5">${'<span class="br-dot"></span>'.repeat(BR.cycles)}</div>
    </div>
    <div id="br-foot" class="w-full max-w-xl" style="min-height:120px"></div>
  </div>`;
  document.body.classList.add('breath-open');
  icons();
  requestAnimationFrame(() => requestAnimationFrame(() => $('#breath')?.classList.add('on')));
  startBreath();
}

function startBreath() {
  if (br) cancelAnimationFrame(br.raf);
  br = { start: Date.now(), pausedAt: null, raf: 0, lock: null, done: false, last: {} };
  document.querySelectorAll('#br-dots .br-dot').forEach(d => d.classList.remove('on'));
  $('#br-foot').innerHTML = `<p class="text-center text-sm text-muted pt-4">Un minuto solo per te. Va bene anche se ti distrai.</p>`;
  brWake();
  br.raf = requestAnimationFrame(breathFrame);
}

/* Aggiorna il DOM solo se il valore è cambiato (niente annunci ripetuti a VoiceOver) */
function brSet(id, val) {
  if (br.last[id] === val) return;
  br.last[id] = val;
  const el = $('#' + id); if (el) el.textContent = val;
}

function breathFrame() {
  if (!br || br.done || br.pausedAt) return;
  const t = Date.now() - br.start, cyc = BR.inh + BR.exh;
  let size = 0, phase, sub, num = '', idx = -1;   // size: 0 = cerchio piccolo, 1 = cerchio pieno

  if (t < BR.lead) {
    phase = 'Mettiti comoda'; sub = 'Spalle giù, mandibola morbida.';
    num = String(Math.ceil((BR.lead - t) / 1000));
  } else if (t < BR.lead + cyc * BR.cycles) {
    const k = t - BR.lead, p = k % cyc;
    idx = Math.floor(k / cyc);
    sub = `Ciclo ${idx + 1} di ${BR.cycles}`;
    if (p < BR.inh) { size = brEase(p / BR.inh);            phase = 'Inspira…'; num = String(Math.ceil((BR.inh - p) / 1000)); }
    else            { size = 1 - brEase((p - BR.inh) / BR.exh); phase = 'Espira…'; num = String(Math.ceil((cyc - p) / 1000)); }
  } else { finishBreath(); return; }

  const ball = $('#br-ball');
  if (ball) {
    if (reduceMQ.matches) {   // niente movimento: il cerchio resta fermo e "respira" solo con la luce
      ball.style.transform = 'scale(.8)';
      ball.style.opacity = (.45 + .55 * size).toFixed(3);
    } else {
      ball.style.transform = `scale(${(BR.min + (1 - BR.min) * size).toFixed(4)})`;
      ball.style.opacity = '';
    }
  }
  brSet('br-phase', phase); brSet('br-sub', sub); brSet('br-num', num);
  if (br.last.idx !== idx) {
    br.last.idx = idx;
    document.querySelectorAll('#br-dots .br-dot').forEach((d, i) => d.classList.toggle('on', i <= idx));
  }
  br.raf = requestAnimationFrame(breathFrame);
}

function finishBreath() {
  br.done = true;
  brRelease();
  const ball = $('#br-ball');
  if (ball) { ball.style.transform = reduceMQ.matches ? 'scale(.8)' : `scale(${BR.min})`; ball.style.opacity = ''; }
  brSet('br-num', '🌿'); brSet('br-phase', 'Fatto'); brSet('br-sub', 'Un minuto tutto per te. Brava.');
  document.querySelectorAll('#br-dots .br-dot').forEach(d => d.classList.add('on'));
  $('#br-foot').innerHTML = `
    <div class="space-y-2">
      <button data-action="breathAgain" class="btn-primary">Ancora un minuto</button>
      <button data-action="breathClose" class="btn-soft w-full">Torna alla giornata</button>
    </div>`;
  chime();
}

function closeBreath() {
  if (br) { cancelAnimationFrame(br.raf); brRelease(); }
  br = null;
  document.body.classList.remove('breath-open');
  const el = $('#breath');
  if (!el) return;
  el.classList.remove('on');
  setTimeout(() => { if (!br) $('#breath-root').innerHTML = ''; }, reduceMQ.matches ? 0 : 400);
}

/* Schermo acceso durante l'esercizio (Wake Lock, se l'iPhone lo supporta) */
async function brWake() {
  const s = br;
  try {
    if (!('wakeLock' in navigator)) return;
    const lock = await navigator.wakeLock.request('screen');
    if (br === s && !s.done) s.lock = lock; else lock.release();
  } catch (e) {}
}
function brRelease() { try { br && br.lock && br.lock.release(); } catch (e) {} if (br) br.lock = null; }

/* Se esce dall'app a metà, l'esercizio si mette in pausa e riprende da dove era */
document.addEventListener('visibilitychange', () => {
  if (!br || br.done) return;
  if (document.visibilityState === 'hidden') { br.pausedAt = Date.now(); cancelAnimationFrame(br.raf); }
  else if (br.pausedAt) { br.start += Date.now() - br.pausedAt; br.pausedAt = null; brWake(); br.raf = requestAnimationFrame(breathFrame); }
});

  newTx: el => openTxForm({ type: el.dataset.type }),
  editTx: el => openTxForm({ id: el.dataset.id }),
  delTx: el => { S.tx = S.tx.filter(x => x.id !== el.dataset.id); save(); closeSheet(); render(); toast('Movimento eliminato'); },

  // Impostazioni
  setTheme: el => {
    S.theme = el.dataset.theme; save(); applyTheme(); render();
    const seg = $('#theme-seg'); if (seg) { seg.innerHTML = themeSeg(); icons(); }
  },
  export: exportBackup,
  resetAll: () => askConfirm({
    title:'Cancellare tutto?', text:'Tutti i dati su questo iPhone verranno eliminati. Se vuoi, prima esporta un backup.', ok:'Cancella tutto',
    cb:() => { S = defaults(); S.onboarded = true; save(); applyTheme(); render(); toast('Si riparte da zero 🌱'); }
  })
};

/* ---------- Submit dei form ---------- */
const fel = (f, n) => f.querySelector(`[name="${n}"]`);
const fv = (f, n) => (fel(f, n)?.value || '');
const forms = {
  addPrio: f => {
    const text = fv(f, 'text').trim(); if (!text) return;
    const d = iso(new Date());
    S.priorities[d] = S.priorities[d] || [];
    if (S.priorities[d].length >= 3) return;
    S.priorities[d].push({ id:uid(), text, done:false });
    // tieni solo gli ultimi 60 giorni di priorità
    const cutoff = iso(addDays(new Date(), -60));
    Object.keys(S.priorities).forEach(k => { if (k < cutoff) delete S.priorities[k]; });
    save(); render();
    setTimeout(() => { const i = document.querySelector('[data-form="addPrio"] input'); if (i) i.focus(); }, 50);
  },
  event: f => {
    const fd = new FormData(f);
    const tag = fd.get('tag') || 'riposo';
    const base = {
      title: (fd.get('title') || '').trim() || TAGS[tag].def,
      date: fd.get('date') || iso(new Date()),
      start: fd.get('start') || '',
      end: fd.get('end') || '',
      tag,
      note: (fd.get('note') || '').trim()
    };
    const id = f.dataset.id;
    if (id) {
      const e = S.events.find(x => x.id === id);
      if (e) Object.assign(e, base);
    } else {
      const n = +fd.get('repeat') || 0;
      for (let i = 0; i <= n; i++) S.events.push({ ...base, id:uid(), date: iso(addDays(fromIso(base.date), 7 * i)) });
    }
    save(); closeSheet();
    agSel = base.date;
    render();
    toast(id ? 'Salvato ✓' : 'Aggiunto in agenda ✓');
  },
  exam: f => {
    const fd = new FormData(f);
    const data = {
      name: (fd.get('name') || '').trim() || 'Esame',
      date: fd.get('date') || '',
      units: Math.max(0, parseInt(fd.get('units'), 10) || 0),
      unit: fd.get('unit') || 'capitoli'
    };
    const id = f.dataset.id;
    if (id) { const ex = S.exams.find(x => x.id === id); if (ex) Object.assign(ex, data); }
    else S.exams.push({ id:uid(), goals:[], ...data });
    save(); closeSheet(); tab = 'studio'; render();
    toast(id ? 'Salvato ✓' : 'Esame aggiunto. Un passo alla volta 🌱');
  },
  split: f => {
    const ex = S.exams.find(x => x.id === f.dataset.id); if (!ex) return;
    const per = Math.max(1, parseInt(fv(f, 'per'), 10) || 1);
    const sing = ex.unit === 'pagine' ? 'Pagina' : 'Capitolo';
    const plur = ex.unit === 'pagine' ? 'Pagine' : 'Capitoli';
    const goals = [];
    for (let i = 1; i <= ex.units; i += per) {
      const end = Math.min(ex.units, i + per - 1);
      goals.push({ id:uid(), text: i === end ? `${sing} ${i}` : `${plur} ${i}–${end}`, done:false });
    }
    if (fel(f, 'review')?.checked) goals.push({ id:uid(), text:'Ripasso finale 🌿', done:false });
    ex.goals = fel(f, 'replace')?.checked ? goals : [...ex.goals, ...goals];
    collapsedExams.delete(ex.id);
    save(); closeSheet(); render();
    toast(`${goals.length} micro-obiettivi creati`);
  },
  addGoal: f => {
    const ex = S.exams.find(x => x.id === f.dataset.id); if (!ex) return;
    const text = fv(f, 'text').trim(); if (!text) return;
    ex.goals.push({ id:uid(), text, done:false });
    save(); render();
    setTimeout(() => { const i = document.querySelector(`[data-form="addGoal"][data-id="${ex.id}"] input`); if (i) i.focus(); }, 50);
  },
  editItem: f => {
    const it = findItem(f.dataset.kind, f.dataset.id, f.dataset.ex);
    const text = fv(f, 'text').trim();
    if (!it || !text) return;
    it.text = text; it.done = !!fel(f, 'done')?.checked;
    save(); closeSheet(); render(); toast('Salvato ✓');
  },
  tx: f => {
    const fd = new FormData(f);
    const amount = parseAmount(fd.get('amount'));
    if (!(amount > 0)) { toast('Inserisci un importo'); return; }
    const data = {
      type: fd.get('type') || 'out',
      amount,
      cat: fd.get('cat') || 'altro',
      note: (fd.get('note') || '').trim(),
      date: fd.get('date') || iso(new Date())
    };
    const id = f.dataset.id;
    if (id) { const t = S.tx.find(x => x.id === id); if (t) Object.assign(t, data); }
    else S.tx.push({ id:uid(), created:Date.now(), ...data });
    wMonth = data.date.slice(0, 7);
    save(); closeSheet(); render();
    toast(id ? 'Salvato ✓' : (data.type === 'in' ? 'Entrata aggiunta ✓' : 'Spesa segnata ✓'));
  },
  settings: f => {
    S.name = fv(f, 'name').trim();
    if (fel(f, 'start')) { const b = parseAmount(fv(f, 'start')); S.startBalance = isFinite(b) ? b : 0; }
    if (fel(f, 'pay')) { const p = parseAmount(fv(f, 'pay')); S.hourlyPay = p > 0 ? p : 0; }   // vuoto = nessuna stima
    if (fel(f, 'workEnd')) S.workEnd = fv(f, 'workEnd');
    save(); closeSheet(); render();
    toast(f.dataset.welcome && S.name ? `Benvenuta, ${S.name} 🌿` : 'Salvato ✓');
  }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  const fn = actions[el.dataset.action];
  if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fn = forms[f.dataset.form];
  if (fn) fn(f);
});
document.addEventListener('change', e => {
  if (e.target.id === 'import-file' && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ''; }
  if (e.target.name === 'type' && e.target.closest('[data-form="tx"]')) {
    const sel = e.target.closest('form').querySelector('input[name="cat"]:checked');
    $('#cat-wrap').innerHTML = txCats(e.target.value, sel && sel.value);
    icons();
  }
});

/* ---------- Offline: service worker ---------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

/* ---------- Tema chiaro/scuro ---------- */
const darkMQ = matchMedia('(prefers-color-scheme: dark)');
function applyTheme() {
  const t = S.theme || 'auto';
  const dark = t === 'dark' || (t === 'auto' && darkMQ.matches);
  document.documentElement.classList.toggle('dark', dark);
  document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#161918' : '#F6F4EE');
}
const onSystemTheme = () => { if ((S.theme || 'auto') === 'auto') { applyTheme(); render(); } };
darkMQ.addEventListener ? darkMQ.addEventListener('change', onSystemTheme) : darkMQ.addListener(onSystemTheme);
function themeSeg() {
  const cur = S.theme || 'auto';
  return [['auto', 'Automatico', 'sun-moon'], ['light', 'Chiaro', 'sun'], ['dark', 'Scuro', 'moon']].map(([v, l, ic]) => `
    <button type="button" data-action="setTheme" data-theme="${v}" class="flex-1 h-11 rounded-xl text-sm font-medium flex items-center justify-center gap-1.5 transition ${cur === v ? 'bg-surface text-ink shadow-soft' : 'text-muted'}">
      <i data-lucide="${ic}" class="w-4 h-4"></i>${l}</button>`).join('');
}

/* ---------- Avvio ---------- */
applyTheme();
render();
if (!S.onboarded) setTimeout(openWelcome, 400);
else setTimeout(maybeBackupNudge, 1500);
</script>
</body>
</html>
